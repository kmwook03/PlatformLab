<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">introduce-me: 자기소개·방명록 OpenShift 아키텍처</title>
  <desc id="desc">브라우저에서 HTTPS Route와 Service를 통해 Node.js 웹 서버에 접속한다. 웹 서버는 내부 Service로 PostgreSQL에 연결하고 DB는 PVC에 데이터를 보존한다. 초기화 컨테이너가 런타임 ConfigMap을 emptyDir에 복원한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #0f172a; font-size: 15px; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 600; }
      .detail { fill: #475569; font-size: 13px; }
      .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .box { stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect width="1000" height="680" fill="#f8fafc"/>
  <text x="40" y="45" class="heading">introduce-me · OpenShift deployment</text>
  <text x="40" y="72" class="detail">Public runtime images + bundled application ConfigMaps + PostgreSQL persistent storage</text>

  <rect x="30" y="112" width="150" height="82" class="box" fill="#fff" stroke="#94a3b8"/>
  <text x="105" y="146" text-anchor="middle" class="label">Browser</text>
  <text x="105" y="173" text-anchor="middle" class="detail">Profile + guestbook</text>
  <rect x="230" y="112" width="220" height="82" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="340" y="141" text-anchor="middle" class="label">Route</text>
  <text x="340" y="163" text-anchor="middle">personal-portfolio</text>
  <text x="340" y="182" text-anchor="middle" class="detail">edge TLS · HTTP → HTTPS</text>
  <rect x="500" y="112" width="220" height="82" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="610" y="141" text-anchor="middle" class="label">Web Service</text>
  <text x="610" y="164" text-anchor="middle">personal-portfolio</text>
  <text x="610" y="183" text-anchor="middle" class="detail">HTTP :8080</text>
  <path d="M180 153H230" class="flow"/><text x="188" y="137" class="detail">HTTPS</text>
  <path d="M450 153H500" class="flow"/>

  <rect x="485" y="253" width="250" height="105" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="283" text-anchor="middle" class="label">Node.js web Pod</text>
  <text x="610" y="307" text-anchor="middle">personal-portfolio</text>
  <text x="610" y="329" text-anchor="middle" class="detail">Static files + guestbook API</text>
  <text x="610" y="347" text-anchor="middle" class="detail">Live / ready probes · 1 replica</text>
  <path d="M610 194V253" class="flow"/>

  <rect x="40" y="247" width="350" height="118" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="215" y="278" text-anchor="middle" class="label">Runtime ConfigMaps × 5</text>
  <text x="215" y="302" text-anchor="middle">Server + dependencies + public + SQL</text>
  <text x="215" y="328" text-anchor="middle" class="detail">init: unpack-runtime · SHA-256 verification</text>
  <text x="215" y="349" text-anchor="middle" class="detail">→ emptyDir → read-only web runtime</text>
  <path d="M390 307H485" class="flow"/>

  <rect x="40" y="411" width="350" height="89" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="215" y="441" text-anchor="middle" class="label">ConfigMap + Secret</text>
  <text x="215" y="466" text-anchor="middle" class="detail">DB host / user / name + DB_PASSWORD</text>
  <text x="215" y="486" text-anchor="middle" class="detail">Shared configuration for web and database</text>
  <path d="M390 437H432V335H485" class="flow"/>

  <rect x="485" y="414" width="250" height="72" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="610" y="445" text-anchor="middle" class="label">DB Service</text>
  <text x="610" y="470" text-anchor="middle">portfolio-db :5432</text>
  <path d="M610 358V414" class="flow"/>
  <text x="625" y="392" class="detail">Internal PostgreSQL connection</text>

  <rect x="485" y="540" width="250" height="94" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="570" text-anchor="middle" class="label">PostgreSQL Pod</text>
  <text x="610" y="594" text-anchor="middle">portfolio-db</text>
  <text x="610" y="617" text-anchor="middle" class="detail">1 replica · Recreate · pg_isready</text>
  <path d="M610 486V540" class="flow"/>
  <path d="M215 500V587H485" class="flow"/>

  <rect x="790" y="540" width="180" height="94" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="880" y="571" text-anchor="middle" class="label">PVC · 1Gi</text>
  <text x="880" y="595" text-anchor="middle">portfolio-db-data</text>
  <text x="880" y="617" text-anchor="middle" class="detail">ReadWriteOnce</text>
  <path d="M735 587H790" class="flow"/>
  <text x="40" y="654" class="detail">DB data survives Pod replacement while the PVC is retained. The database has no external Route.</text>
</svg>
