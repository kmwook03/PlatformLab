apiVersion: v1
kind: ConfigMap
metadata:
  name: personal-portfolio-config
  labels:
    app: personal-portfolio
data:
  PORT: "8080"
  NODE_ENV: production
  DB_HOST: portfolio-db
  DB_PORT: "5432"
  DB_NAME: portfolio
  DB_USER: portfolio
  DB_STARTUP_TIMEOUT_MS: "90000"
  # Router CIDRs must be verified before trusting forwarded client IPs.
  TRUST_PROXY: "false"
