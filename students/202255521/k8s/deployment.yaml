apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-portfolio
  labels:
    app: personal-portfolio
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: personal-portfolio
  template:
    metadata:
      labels:
        app: personal-portfolio
      annotations:
        portfolio/runtime-sha256: "7c7e8dd55b34f87a4fcb936be2c37bbbdd62e663e718984719740aa2a042c6ce"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: unpack-runtime
          image: docker.io/library/node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              const zlib = require('node:zlib');
              const crypto = require('node:crypto');
              const parts = fs.readdirSync('/bundle').filter(name => /^runtime-\d+\.part$/.test(name)).sort();
              const bytes = Buffer.concat(parts.map(name => fs.readFileSync(path.join('/bundle', name))));
              if (crypto.createHash('sha256').update(bytes).digest('hex') !== process.env.RUNTIME_SHA256) throw Error('Runtime checksum mismatch');
              const files = JSON.parse(zlib.gunzipSync(bytes));
              for (const [name, content] of Object.entries(files)) {
                const target = path.resolve('/app', name);
                if (!target.startsWith('/app/')) throw Error('Invalid runtime path');
                fs.mkdirSync(path.dirname(target), { recursive: true, mode: 0o755 });
                fs.writeFileSync(target, Buffer.from(content, 'base64'), { mode: 0o644 });
              }
          env:
            - name: RUNTIME_SHA256
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['portfolio/runtime-sha256']
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runtime-bundle
              mountPath: /bundle
              readOnly: true
            - name: runtime
              mountPath: /app
      containers:
        - name: web
          image: docker.io/library/node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
          imagePullPolicy: IfNotPresent
          command: [node, /opt/portfolio/src/server.mjs]
          workingDir: /opt/portfolio
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: personal-portfolio-config
            - secretRef:
                name: portfolio-db-auth
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: runtime
              mountPath: /opt/portfolio
              readOnly: true
      volumes:
        - name: runtime-bundle
          projected:
            defaultMode: 0444
            sources:
            # BEGIN RUNTIME SOURCES
              - configMap:
                  name: personal-portfolio-runtime-00
              - configMap:
                  name: personal-portfolio-runtime-01
              - configMap:
                  name: personal-portfolio-runtime-02
              - configMap:
                  name: personal-portfolio-runtime-03
              - configMap:
                  name: personal-portfolio-runtime-04
            # END RUNTIME SOURCES
        - name: runtime
          emptyDir:
            sizeLimit: 16Mi
