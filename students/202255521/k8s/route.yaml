apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: personal-portfolio
  labels:
    app: personal-portfolio
spec:
  to:
    kind: Service
    name: personal-portfolio
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
